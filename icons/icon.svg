<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1c30"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#82f5c1"/>
      <stop offset="100%" stop-color="#006c4a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#213145" stroke-width="4"/>

  <!-- Grid Lines -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#213145" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="280" x2="432" y2="280" stroke="#213145" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="200" x2="432" y2="200" stroke="#213145" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Candlestick / Bars -->
  <!-- Bar 1 -->
  <line x1="130" y1="270" x2="130" y2="360" stroke="#006c4a" stroke-width="3"/>
  <rect x="114" y="290" width="32" height="50" rx="4" fill="#006c4a"/>

  <!-- Bar 2 -->
  <line x1="205" y1="230" x2="205" y2="350" stroke="#82f5c1" stroke-width="3"/>
  <rect x="189" y="250" width="32" height="70" rx="4" fill="#006c4a"/>

  <!-- Bar 3 -->
  <line x1="280" y1="180" x2="280" y2="320" stroke="#82f5c1" stroke-width="3"/>
  <rect x="264" y="210" width="32" height="75" rx="4" fill="#82f5c1"/>

  <!-- Bar 4 (Breakout) -->
  <line x1="355" y1="120" x2="355" y2="270" stroke="#82f5c1" stroke-width="3"/>
  <rect x="339" y="145" width="32" height="95" rx="4" fill="url(#emeraldGrad)"/>

  <!-- Dynamic Upward Trend Curve with Glow -->
  <path d="M 100 340 Q 200 310 270 230 T 420 120" fill="none" stroke="#82f5c1" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Terminal Arrow Pin Point -->
  <circle cx="420" cy="120" r="14" fill="#82f5c1"/>
  <circle cx="420" cy="120" r="7" fill="#0b1c30"/>

  <!-- Currency / Ledger Brand Accent -->
  <text x="256" y="440" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#f8f9ff" text-anchor="middle" letter-spacing="2">TRADELEDGER</text>
  <text x="256" y="470" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#82f5c1" text-anchor="middle" letter-spacing="4">SWING TRADER OS</text>
</svg>
